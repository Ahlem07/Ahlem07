<svg width="900" height="260" viewBox="0 0 900 260" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eaf6f6"/>
      <stop offset="55%" stop-color="#f3ecfa"/>
      <stop offset="100%" stop-color="#fdf1ea"/>
    </linearGradient>
  </defs>
  <rect width="900" height="260" rx="18" fill="url(#bg2)"/>

  <!-- AI side: pastel mint circuit lines pulsing -->
  <g stroke="#7fd8cf" stroke-width="2.5" fill="none" opacity="0.85">
    <path d="M40 60 H160 V100 H260">
      <animate attributeName="opacity" values="0.25;1;0.25" dur="2.2s" repeatCount="indefinite"/>
    </path>
    <path d="M40 180 H140 V140 H260">
      <animate attributeName="opacity" values="1;0.25;1" dur="2.6s" repeatCount="indefinite"/>
    </path>
    <path d="M40 120 H200">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="1.8s" repeatCount="indefinite"/>
    </path>
  </g>
  <g fill="#4fb3a9">
    <circle cx="40" cy="60" r="4"><animate attributeName="r" values="3;6;3" dur="2.2s" repeatCount="indefinite"/></circle>
    <circle cx="40" cy="120" r="4"><animate attributeName="r" values="3;6;3" dur="1.8s" repeatCount="indefinite"/></circle>
    <circle cx="40" cy="180" r="4"><animate attributeName="r" values="3;6;3" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="260" cy="100" r="4"/>
    <circle cx="260" cy="140" r="4"/>
    <circle cx="200" cy="120" r="4"/>
  </g>
  <text x="150" y="230" text-anchor="middle" font-family="Verdana, Arial, sans-serif" font-size="14" fill="#4fb3a9" font-weight="bold">AI &amp; DATA</text>

  <!-- rotating AI / gear hybrid icon, soft gold pastel -->
  <g transform="translate(300,130)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="8s" repeatCount="indefinite"/>
      <path d="M0,-38 L8,-30 L20,-33 L24,-22 L36,-18 L33,-6 L38,4 L28,10 L26,22 L14,20 L6,30 L-2,22 L-14,24 L-16,12 L-28,8 L-24,-4 L-32,-14 L-20,-20 L-18,-32 L-6,-30 Z"
        fill="none" stroke="#f2c68a" stroke-width="2.5"/>
    </g>
    <circle cx="0" cy="0" r="14" fill="#ffffff" stroke="#7fd8cf" stroke-width="2"/>
    <circle cx="0" cy="0" r="4" fill="#7fd8cf">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="1.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- civil side: pastel coral/peach rising buildings -->
  <g fill="#f2b8a4">
    <rect x="560" y="230" width="34" height="0">
      <animate attributeName="height" values="0;90;90;0" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="y" values="230;140;140;230" dur="4s" repeatCount="indefinite"/>
    </rect>
    <rect x="605" y="230" width="34" height="0" fill="#e8a6c1">
      <animate attributeName="height" values="0;60;60;0;0" dur="4s" begin="0.3s" repeatCount="indefinite"/>
      <animate attributeName="y" values="230;170;170;230;230" dur="4s" begin="0.3s" repeatCount="indefinite"/>
    </rect>
    <rect x="650" y="230" width="34" height="0">
      <animate attributeName="height" values="0;120;120;0" dur="4s" begin="0.6s" repeatCount="indefinite"/>
      <animate attributeName="y" values="230;110;110;230" dur="4s" begin="0.6s" repeatCount="indefinite"/>
    </rect>
    <rect x="695" y="230" width="34" height="0" fill="#f2c68a">
      <animate attributeName="height" values="0;75;75;0" dur="4s" begin="0.9s" repeatCount="indefinite"/>
      <animate attributeName="y" values="230;155;155;230" dur="4s" begin="0.9s" repeatCount="indefinite"/>
    </rect>
    <rect x="740" y="230" width="34" height="0">
      <animate attributeName="height" values="0;100;100;0" dur="4s" begin="1.2s" repeatCount="indefinite"/>
      <animate attributeName="y" values="230;130;130;230" dur="4s" begin="1.2s" repeatCount="indefinite"/>
    </rect>
    <rect x="785" y="230" width="34" height="0" fill="#e8a6c1">
      <animate attributeName="height" values="0;50;50;0" dur="4s" begin="1.5s" repeatCount="indefinite"/>
      <animate attributeName="y" values="230;180;180;230" dur="4s" begin="1.5s" repeatCount="indefinite"/>
    </rect>
  </g>
  <line x1="540" y1="230" x2="840" y2="230" stroke="#d9a9c4" stroke-width="2" opacity="0.7"/>
  <text x="690" y="248" text-anchor="middle" font-family="Verdana, Arial, sans-serif" font-size="14" fill="#c97f9c" font-weight="bold">CIVIL ENGINEERING</text>
</svg>
